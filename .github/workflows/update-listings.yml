# Weekly automatic update of two-step (wave 1: film; wave 2: theatre, dance and stage music).
# Runs on GitHub's free runners, without Claude: reads the official programme pages,
# updates screenings.json and feed.xml, and pushes the result. GitHub Pages then republishes the site.
name: Weekly listings update
on:
  schedule:
    - cron: "17 4 * * 3"   # Wednesday 04:17 UTC = 05:17 (winter) / 06:17 (summer) in Brussels
  workflow_dispatch: {}     # "Run workflow" button in the Actions tab, for a manual run
permissions:
  contents: write
  pages: write
concurrency:
  group: listings-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the venue programmes (film)
        run: python3 scripts/update_films.py
      - name: Install the headless browser (only Arca and Opera Ballet need it)
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Read the stage programmes (theatre, dance, music)
        run: python3 scripts/update_stage.py
      - name: Rebuild the RSS feed
        run: SITE_URL=https://peapickers.github.io/peapickersfeed python3 scripts/build_feed.py
      - name: Save and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenings.json feed.xml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Weekly listings update $(date -u +%Y-%m-%d)"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages will rebuild on its own"
